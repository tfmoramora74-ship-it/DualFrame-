name: DualFrame
options:
  bundleIdPrefix: com.tfmora
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "8"
targets:
  DualFrame:
    type: application
    platform: iOS
    sources:
      - path: DualFrame
    info:
      path: DualFrame/Info.plist
      properties:
        CFBundleDisplayName: DualFrame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Grava vídeo vertical e horizontal ao mesmo tempo.
        NSMicrophoneUsageDescription: Grava o áudio junto com o vídeo.
        NSPhotoLibraryAddUsageDescription: Salva suas gravações no app Fotos.
        NSMotionUsageDescription: Usa o acelerômetro para o nível do horizonte.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tfmora.dualframe
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
