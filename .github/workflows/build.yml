name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DualFrame.xcodeproj \
            -scheme DualFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          if [ ! -d build/Build/Products/Release-iphoneos/DualFrame.app ]; then
            # Surface compiler errors as public annotations.
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | sed 's#.*/DualFrame/##')"
            done
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DualFrame.app Payload/
          zip -qry DualFrame.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DualFrame-ipa
          path: DualFrame.ipa

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DualFrame (latest build)
          body: Unsigned IPA for LiveContainer. Built from ${{ github.sha }}.
          prerelease: true
          files: DualFrame.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
